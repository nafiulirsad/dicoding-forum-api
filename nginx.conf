# ---------------------------------------------------------------------------
# Konfigurasi NGINX untuk Forum API
# Dicoding — Proyek Akhir "Menjadi Back-End Developer Expert" (CI/CD & Security)
#
# Lokasi di server : /etc/nginx/sites-available/forumapi.nafiulirsad.my.id
# Aktifkan dengan  : ln -s /etc/nginx/sites-available/forumapi.nafiulirsad.my.id \
#                       /etc/nginx/sites-enabled/forumapi.nafiulirsad.my.id
#
# Berkas pada sites-enabled di-include di dalam blok http {}, sehingga direktif
# limit_req_zone di bawah ini berada pada konteks yang benar.
# ---------------------------------------------------------------------------

# Zona pembatas permintaan berbasis alamat IP klien.
# rate=90r/m  -> 90 permintaan per menit per IP, sesuai kriteria submission.
# 10m         -> ~160.000 alamat IP dapat dilacak dalam shared memory zone ini.
limit_req_zone $binary_remote_addr zone=forumapi_threads:10m rate=90r/m;

# Kembalikan 429 Too Many Requests (bukan 503) agar klien tahu ini rate limit.
limit_req_status 429;

upstream forumapi_backend {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name forumapi.nafiulirsad.my.id;

    # Semua trafik HTTP dipaksa ke HTTPS supaya terhindar dari MITM.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name forumapi.nafiulirsad.my.id;

    access_log /var/log/nginx/forumapi.access.log;
    error_log  /var/log/nginx/forumapi.error.log;

    ssl_certificate     /etc/letsencrypt/live/forumapi.nafiulirsad.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forumapi.nafiulirsad.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 1M;

    # --- Limit Access -------------------------------------------------------
    # Hanya resource /threads dan seluruh path di dalamnya yang dibatasi.
    # burst=90 nodelay: 90 permintaan pertama dilayani seketika, selebihnya
    # ditolak dengan 429 sampai kuota menit berikutnya tersedia.
    location /threads {
        limit_req zone=forumapi_threads burst=90 nodelay;

        proxy_pass http://forumapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Resource lain (users, authentications) tidak dibatasi.
    location / {
        proxy_pass http://forumapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
